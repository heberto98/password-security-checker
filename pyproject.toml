[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "password-security-checker"
version = "0.2.0"
description = "Aplicación web educativa para analizar la fortaleza de contraseñas sin persistencia."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["fastapi>=0.141.1,<0.142", "uvicorn>=0.53,<0.54"]

[project.optional-dependencies]
test = ["httpx2>=2.13.1,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"password_security_checker.web" = ["static/*.html", "static/*.css", "static/*.js", "static/*.svg"]
